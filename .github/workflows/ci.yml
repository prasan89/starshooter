name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to avoid wasted compute.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Android)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java (required for Android toolchain) ───────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Flutter SDK cache ───────────────────────────────────────────────────
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: flutter-stable-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            flutter-stable-${{ runner.os }}-

      # ── Flutter setup ───────────────────────────────────────────────────────
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── Pub package cache ───────────────────────────────────────────────────
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # ── Dependencies ─────────────────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── Format check ─────────────────────────────────────────────────────────
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # ── Static analysis ───────────────────────────────────────────────────────
      - name: Analyze (fatal infos & warnings)
        run: flutter analyze --fatal-infos --fatal-warnings

      # ── Tests ─────────────────────────────────────────────────────────────────
      - name: Run tests with coverage
        run: flutter test --coverage

      # ── Coverage upload (optional — never fails the build) ────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

      # ── Android debug build ───────────────────────────────────────────────────
      - name: Build Android APK (debug)
        run: flutter build apk --debug

      # ── Upload APK artifact ───────────────────────────────────────────────────
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
